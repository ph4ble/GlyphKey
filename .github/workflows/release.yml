name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: swiftc --version

      - name: Build
        run: sh build.sh

      - name: Package app
        run: ditto -c -k --keepParent GlyphKey.app "GlyphKey-${GITHUB_REF_NAME}.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "GlyphKey-${GITHUB_REF_NAME}.zip" \
            --title "GlyphKey ${GITHUB_REF_NAME}" \
            --notes-file .github/release-notes.md
